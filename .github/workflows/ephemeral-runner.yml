name: Ephemeral Hetzner Runner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      server_id: ${{ steps.create.outputs.server_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Generate runner token
        id: runner_token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token)

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "❌ Failed to generate runner token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy VPS
        id: create
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RUNNER_TOKEN: ${{ steps.runner_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x infra/deploy.sh
          infra/deploy.sh

  wait-runner:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for runner (polling)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "⏳ Waiting for runner..."

          for i in {1..30}; do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/actions/runners)

            if echo "$RESPONSE" | jq -e '.runners[] | select(.status=="online")' > /dev/null; then
              echo "✅ Runner is online"
              exit 0
            fi

            sleep 5
          done

          echo "❌ Runner did not come online"
          exit 1

  tests:
    needs: wait-runner
    runs-on: [self-hosted, ephemeral, hetzner]

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pytest

  destroy:
    needs: [deploy, tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Destroy VPS
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          SERVER_ID: ${{ needs.deploy.outputs.server_id }}
        run: |
          set -euo pipefail

          echo "Deleting server: $SERVER_ID"

          curl -s -X DELETE \
            "https://api.hetzner.cloud/v1/servers/$SERVER_ID" \
            -H "Authorization: Bearer $HETZNER_TOKEN"

          echo "✅ Server deleted"
